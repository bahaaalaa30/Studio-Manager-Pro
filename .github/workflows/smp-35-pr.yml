name: SMP-35 PR Apply
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [vercel-deployment]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply inventory changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          f = Path('artifacts/studio-management/src/pages/AdminManagement.tsx')
          s = f.read_text()
          s = s.replace('inventory: { title: "Inventory Items", description: "Manage inventory master items and low-stock thresholds.", icon: PackageCheck, fields: ["name", "sku", "category", "unit", "quantity", "minimum_quantity", "status"], labels: { name: "Item Name", sku: "SKU", category: "Category", unit: "Unit", quantity: "Quantity", minimum_quantity: "Minimum Quantity", status: "Status" } },', 'inventory: { title: "Inventory Items", description: "Manage inventory master items and low-stock thresholds.", icon: PackageCheck, fields: ["name", "category", "unit", "quantity", "minimum_quantity"], labels: { name: "Item Name", category: "Category", unit: "Unit", quantity: "Quantity", minimum_quantity: "Minimum Quantity" } },', 1)
          old = '  else if (resource === "inventory") { required("name", "Item name is required."); required("sku", "SKU is required."); required("unit", "Unit is required."); required("status", "Status is required."); }'
          new = '''  else if (resource === "inventory") {
    required("name", "Item name is required."); required("category", "Category is required."); required("unit", "Unit is required.");
    const alphaNumeric = /^[A-Za-z0-9\\u0600-\\u06FF]+(?:[ A-Za-z0-9\\u0600-\\u06FF]+)*$/u;
    if (form.name && !alphaNumeric.test(form.name.trim())) errors.name = "Item name may contain letters, numbers and spaces only.";
    if (form.category && !alphaNumeric.test(form.category.trim())) errors.category = "Category may contain letters, numbers and spaces only.";
    if (form.unit && !alphaNumeric.test(form.unit.trim())) errors.unit = "Unit may contain letters, numbers and spaces only.";
    const quantity = Number(form.quantity); const minimum = Number(form.minimum_quantity);
    if (form.quantity === "" || !Number.isFinite(quantity) || quantity < 0) errors.quantity = "Quantity must be a number greater than or equal to 0.";
    if (form.minimum_quantity === "" || !Number.isFinite(minimum) || minimum < 0) errors.minimum_quantity = "Minimum Quantity must be a number greater than or equal to 0.";
    else if (Number.isFinite(quantity) && minimum > quantity) errors.minimum_quantity = "Minimum Quantity cannot be greater than Quantity.";
  }'''
          if old not in s: raise SystemExit('frontend validation marker missing')
          s = s.replace(old, new, 1)
          s = s.replace('  const validationErrors = editing ? resource === "services" ? validateService(form) : validateGeneric(form, resource) : {};', '  const validationErrors = editing ? resource === "services" ? validateService(form) : validateGeneric(form, resource) : {};\n  const [inventoryAnalytics, setInventoryAnalytics] = useState<{totalItems:number;lowStockItems:number;criticalItems:number;outOfStockItems:number;totalQuantity:number} | null>(null);\n  useEffect(() => { if (resource !== "inventory") { setInventoryAnalytics(null); return; } let active = true; fetch("/api/admin/inventory/analytics", { headers: { Accept: "application/json" } }).then((r) => r.ok ? r.json() : null).then((v) => { if (active && v) setInventoryAnalytics(v); }).catch(() => undefined); return () => { active = false; }; }, [resource]);', 1)
          needle = '  return <div className="p-4 sm:p-6 lg:p-8 max-w-[1500px] mx-auto w-full space-y-5">'
          analytics = '''  return <div className="p-4 sm:p-6 lg:p-8 max-w-[1500px] mx-auto w-full space-y-5">
    {resource === "inventory" && inventoryAnalytics && <div className="grid grid-cols-2 md:grid-cols-5 gap-3">{[["Total Items", inventoryAnalytics.totalItems], ["Low Stock", inventoryAnalytics.lowStockItems], ["Critical Stock", inventoryAnalytics.criticalItems], ["Out of Stock", inventoryAnalytics.outOfStockItems], ["Total Quantity", inventoryAnalytics.totalQuantity]].map(([label, value]) => <Card key={String(label)}><CardHeader className="pb-2"><CardTitle className="text-sm font-medium">{label}</CardTitle></CardHeader><CardContent><div className="text-2xl font-semibold">{value}</div></CardContent></Card>)}</div>}'''
          if needle not in s: raise SystemExit('frontend return marker missing')
          s = s.replace(needle, analytics, 1)
          f.write_text(s)

          a = Path('artifacts/api-server/src/routes/admin.ts')
          s = a.read_text()
          s = s.replace('inventory: { table: "smp_inventory_items", columns: ["name", "sku", "category", "unit", "quantity", "minimum_quantity", "status"] },', 'inventory: { table: "smp_inventory_items", columns: ["name", "category", "unit", "quantity", "minimum_quantity"] },', 1)
          validator = '''\nfunction validateInventory(data: Record<string, unknown>) {\n  const name = String(data.name ?? "").trim(); const category = String(data.category ?? "").trim(); const unit = String(data.unit ?? "").trim();\n  const quantity = Number(data.quantity); const minimumQuantity = Number(data.minimum_quantity);\n  const alphaNumeric = /^[A-Za-z0-9\\u0600-\\u06FF]+(?:[ A-Za-z0-9\\u0600-\\u06FF]+)*$/u;\n  if (!name || !alphaNumeric.test(name)) return "Item name is required and must contain letters, numbers and spaces only.";\n  if (!category || !alphaNumeric.test(category)) return "Category is required and must contain letters, numbers and spaces only.";\n  if (!unit || !alphaNumeric.test(unit)) return "Unit is required and must contain letters, numbers and spaces only.";\n  if (!Number.isFinite(quantity) || quantity < 0) return "Quantity must be a number greater than or equal to 0.";\n  if (!Number.isFinite(minimumQuantity) || minimumQuantity < 0) return "Minimum Quantity must be a number greater than or equal to 0.";\n  if (minimumQuantity > quantity) return "Minimum Quantity cannot be greater than Quantity.";\n  return null;\n}\n'''
          s = s.replace('\nrouter.get("/admin/:resource"', validator + '\nrouter.get("/admin/:resource"', 1) if 'function validateInventory(' not in s else s
          analytics = '''\nrouter.get("/admin/inventory/analytics", async (req, res) => {\n  try { const result = await db.execute(sql.raw(`SELECT COUNT(*)::int AS total_items, COUNT(*) FILTER (WHERE quantity <= minimum_quantity AND quantity > 0)::int AS low_stock_items, COUNT(*) FILTER (WHERE minimum_quantity > quantity)::int AS critical_items, COUNT(*) FILTER (WHERE quantity = 0)::int AS out_of_stock_items, COALESCE(SUM(quantity), 0)::numeric AS total_quantity FROM smp_inventory_items`)); const row = result.rows[0] ?? {}; return res.json({ totalItems: Number(row.total_items ?? 0), lowStockItems: Number(row.low_stock_items ?? 0), criticalItems: Number(row.critical_items ?? 0), outOfStockItems: Number(row.out_of_stock_items ?? 0), totalQuantity: Number(row.total_quantity ?? 0) }); } catch (error) { req.log.error({ err: error }, "Inventory analytics failed"); return res.status(500).json({ error: "Failed to load inventory analytics" }); }\n});\n'''
          s = s.replace('router.get("/admin/:resource"', analytics + '\nrouter.get("/admin/:resource"', 1) if 'router.get("/admin/inventory/analytics"' not in s else s
          post = '''\nrouter.post("/admin/inventory", async (req, res) => {\n  const data = req.body && typeof req.body === "object" ? req.body as Record<string, unknown> : {}; const validation = validateInventory(data);\n  if (validation) return res.status(400).json({ error: validation });\n  try { const result = await db.execute(sql.raw(`INSERT INTO smp_inventory_items (name, category, unit, quantity, minimum_quantity, status, sku) VALUES (${quote(String(data.name).trim())}, ${quote(String(data.category).trim())}, ${quote(String(data.unit).trim())}, ${Number(data.quantity)}, ${Number(data.minimum_quantity)}, 'ACTIVE', NULL) RETURNING id, name, category, unit, quantity, minimum_quantity, status, created_at, updated_at`)); return res.status(201).json(result.rows[0]); } catch (error) { req.log.error({ err: error }, "Inventory create failed"); return res.status(400).json({ error: "Failed to create inventory item." }); }\n});\n'''
          s = s.replace('router.post("/admin/:resource"', post + '\nrouter.post("/admin/:resource"', 1) if 'router.post("/admin/inventory"' not in s else s
          patch = '''\n  if (req.params.resource === "inventory") {\n    const existing = await db.execute(sql.raw(`SELECT id, name, category, unit, quantity, minimum_quantity, status FROM smp_inventory_items WHERE id = ${id} LIMIT 1`)); if (!existing.rows.length) return res.status(404).json({ error: "Record not found" });\n    const merged = { ...(existing.rows[0] as Record<string, unknown>), ...data }; const validation = validateInventory(merged); if (validation) return res.status(400).json({ error: validation });\n    try { const result = await db.execute(sql.raw(`UPDATE smp_inventory_items SET name = ${quote(String(merged.name).trim())}, category = ${quote(String(merged.category).trim())}, unit = ${quote(String(merged.unit).trim())}, quantity = ${Number(merged.quantity)}, minimum_quantity = ${Number(merged.minimum_quantity)}, updated_at = NOW() WHERE id = ${id} RETURNING id, name, category, unit, quantity, minimum_quantity, status, created_at, updated_at`)); return res.json(result.rows[0]); } catch (error) { req.log.error({ err: error }, "Inventory update failed"); return res.status(400).json({ error: "Failed to update inventory item." }); }\n  }\n'''
          s = s.replace('  if (req.params.resource === "services") {', patch + '  if (req.params.resource === "services") {', 1)
          a.write_text(s)

          d = Path('lib/db/src/index.ts')
          s = d.read_text()
          s = s.replace("CREATE TABLE IF NOT EXISTS smp_inventory_items (id SERIAL PRIMARY KEY, name TEXT NOT NULL, sku TEXT NOT NULL UNIQUE, category TEXT, unit TEXT NOT NULL DEFAULT 'piece', quantity NUMERIC(12,2) NOT NULL DEFAULT 0, minimum_quantity NUMERIC(12,2) NOT NULL DEFAULT 0, status TEXT NOT NULL DEFAULT 'ACTIVE', created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(), updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW());", "CREATE TABLE IF NOT EXISTS smp_inventory_items (id SERIAL PRIMARY KEY, name TEXT NOT NULL, sku TEXT, category TEXT, unit TEXT NOT NULL DEFAULT 'piece', quantity NUMERIC(12,2) NOT NULL DEFAULT 0, minimum_quantity NUMERIC(12,2) NOT NULL DEFAULT 0, status TEXT NOT NULL DEFAULT 'ACTIVE', created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(), updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW());", 1)
          if 'ALTER TABLE smp_inventory_items ALTER COLUMN sku DROP NOT NULL;' not in s:
              marker = '        CREATE TABLE IF NOT EXISTS smp_inventory_items'
              pos = s.find(marker); end = s.find(');`);', pos)
              if pos < 0 or end < 0: raise SystemExit('db inventory marker missing')
              s = s[:end+3] + '\n        ALTER TABLE smp_inventory_items ALTER COLUMN sku DROP NOT NULL;\n        ALTER TABLE smp_inventory_items DROP CONSTRAINT IF EXISTS smp_inventory_items_sku_key;' + s[end+3:]
          d.write_text(s)
          PY
      - name: Commit implementation to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/studio-management/src/pages/AdminManagement.tsx artifacts/api-server/src/routes/admin.ts lib/db/src/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "SMP-35: implement inventory improvements"
          git push origin HEAD:${GITHUB_HEAD_REF}
