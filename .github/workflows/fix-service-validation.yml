name: Apply service duplicate validation fix

on:
  push:
    branches:
      - fix/service-api-duplicate-validation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch existing admin service route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/routes/admin.ts')
          s = p.read_text()
          old = '''    const normalized = { ...data, name: String(data.name).trim().replace(/\\s+/g, " "), code: String(data.code).trim(), price: Number(data.is_free === true || String(data.is_free).toLowerCase() === "true" ? 0 : data.price), is_free: data.is_free === true || String(data.is_free ?? "").toLowerCase() === "true", urgent_allowed: data.urgent_allowed === true || String(data.urgent_allowed ?? "").toLowerCase() === "true", urgent_price: data.urgent_allowed === true || String(data.urgent_allowed ?? "").toLowerCase() === "true" ? Number(data.urgent_price) : null, normal_delivery_days: Number(data.normal_delivery_days), urgent_delivery_days: data.urgent_allowed === true || String(data.urgent_allowed ?? "").toLowerCase() === "true" ? Number(data.urgent_delivery_days) : null, description: data.description ? String(data.description).trim() : null, status: normalizeStatus(data.status) };
    const fields = resource.columns.filter((c) => normalized[c] !== undefined && normalized[c] !== "");
    try { const values = fields.map((field) => quote(normalized[field])); const result = await db.execute(sql.raw(`INSERT INTO ${resource.table} (${fields.join(",")}) VALUES (${values.join(",")}) RETURNING *`)); return res.status(201).json(result.rows[0]); }'''
          new = '''    const normalized = { ...data, name: String(data.name).trim().replace(/\\s+/g, " "), code: String(data.code).trim(), price: Number(data.is_free === true || String(data.is_free).toLowerCase() === "true" ? 0 : data.price), is_free: data.is_free === true || String(data.is_free ?? "").toLowerCase() === "true", urgent_allowed: data.urgent_allowed === true || String(data.urgent_allowed ?? "").toLowerCase() === "true", urgent_price: data.urgent_allowed === true || String(data.urgent_allowed ?? "").toLowerCase() === "true" ? Number(data.urgent_price) : null, normal_delivery_days: Number(data.normal_delivery_days), urgent_delivery_days: data.urgent_allowed === true || String(data.urgent_allowed ?? "").toLowerCase() === "true" ? Number(data.urgent_delivery_days) : null, description: data.description ? String(data.description).trim() : null, status: normalizeStatus(data.status) };
    const duplicateName = await db.execute(sql.raw(`SELECT id FROM smp_services WHERE LOWER(TRIM(name)) = LOWER(${quote(normalized.name)}) LIMIT 1`));
    if (duplicateName.rows.length) return res.status(409).json({ error: "Service name already exists. Please choose a different name.", field: "name", code: "DUPLICATE_SERVICE_NAME" });
    const duplicateCode = await db.execute(sql.raw(`SELECT id FROM smp_services WHERE UPPER(TRIM(code)) = UPPER(${quote(normalized.code)}) LIMIT 1`));
    if (duplicateCode.rows.length) return res.status(409).json({ error: "Service code already exists. Please choose a different code.", field: "code", code: "DUPLICATE_SERVICE_CODE" });
    const fields = resource.columns.filter((c) => normalized[c] !== undefined && normalized[c] !== "");
    try { const values = fields.map((field) => quote(normalized[field])); const result = await db.execute(sql.raw(`INSERT INTO ${resource.table} (${fields.join(",")}) VALUES (${values.join(",")}) RETURNING *`)); return res.status(201).json(result.rows[0]); }'''
          if old not in s:
              raise SystemExit('Target service create block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/admin.ts
          git commit -m "fix: validate duplicate service name and code before insert"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/fix-service-validation.yml
          git commit -m "chore: remove one-time service validation workflow"
          git push
