name: Apply SMP-41 validation fix

on:
  push:
    branches:
      - bugfix/SMP-41-validation-errors

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply validation fix
        run: python3 scripts/fix_smp41_validation.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/studio-management/src/pages/AdminManagement.tsx
          git commit -m "fix: improve settings validation errors for SMP-41" || exit 0
          git push
