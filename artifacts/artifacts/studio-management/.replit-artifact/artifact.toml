kind = "web"
previewPath = "/"
title = "Studio Management System"
version = "1.0.0"
id = "artifacts/studio-management"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20749

[services.development]
run = "pnpm --filter @workspace/studio-management run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/studio-management", "run", "build" ]
serve = "static"
publicDir = "artifacts/studio-management/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20749"
BASE_PATH = "/"
